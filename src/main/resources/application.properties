# ===============================
# CORE SPRING SETTINGS
# ===============================
spring.profiles.active=prod
spring.application.name=saasno-backend
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jackson.time-zone=Asia/Jakarta

# ===============================
# SERVER CONFIG
# ===============================
server.port=8000
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.max-connections=200
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ===============================
# DATASOURCE CONFIG
# ===============================
spring.datasource.url=${SAASNO_DATABASE_URL:jdbc:postgresql://localhost:5432/saasno}
spring.datasource.username=${SAASNO_DATABASE_USERNAME:database}
spring.datasource.password=${SAASNO_DATABASE_PASSWORD:database}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# RABBIT MQ CONFIG
# ===============================
spring.rabbitmq.host=${SAASNO_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SAASNO_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SAASNO_RABBITMQ_PASSWORD:admin123}

# ===============================
# REDIS CONFIG
# ===============================
spring.data.redis.host=${SAASNO_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${SAASNO_REDIS_PASSWORD:admin}
spring.data.redis.timeout=6000

# ===============================
# MONGODB CONFIG (audit log)
# ===============================
spring.data.mongodb.uri=${SAASNO_MONGODB_URI:mongodb://database:database@localhost:27017/saasno?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jackson.default-property-inclusion=non_null

# ===============================
# CUSTOM
# ===============================
app.upload.dir=${user.dir}/uploads/
# Unggah foto produk katalog (satu berkas per permintaan)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
